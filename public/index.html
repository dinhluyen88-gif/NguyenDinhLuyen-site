<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Nguyễn Đình Luyện</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="/vi/" />
    <meta http-equiv="refresh" content="0; url=/vi/" />
    <script>
      // Khách dùng trình duyệt tiếng Anh được đưa sang bản tiếng Anh.
      var lang = (navigator.language || "vi").toLowerCase();
      location.replace(lang.indexOf("vi") === 0 ? "/vi/" : "/en/");
    </script>
  </head>
  <body>
    <p><a href="/vi/">Tiếng Việt</a> · <a href="/en/">English</a></p>
  </body>
</html>
